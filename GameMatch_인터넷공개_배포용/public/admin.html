<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameMatch 관리자</title><link rel="stylesheet" href="/style.css"></head><body><main class="section"><div class="panel"><h1>GameMatch 관리자</h1><p class="muted">승인/거절은 실제 DB의 인증 상태를 변경합니다.</p><input id="key" type="password" placeholder="관리자 키"><button onclick="loadProfiles()">프로필 불러오기</button><div id="list"></div></div></main><script>async function loadProfiles(){const key=document.getElementById('key').value;const r=await fetch('/api/admin/profiles',{headers:{'x-admin-key':key}});const d=await r.json();if(!r.ok)return alert(d.message);window.k=key;document.getElementById('list').innerHTML=d.map(x=>`<div class="panel" style="margin-top:12px"><b>${x.nickname}</b> · ${x.age}세 · ${x.game} · ${x.tier}<br><small>${x.riot_id||x.battletag||''} · ${x.verified?'인증됨':'미인증'}</small><br><button onclick="act('${x.id}',true)">승인</button> <button onclick="act('${x.id}',false)">거절</button></div>`).join('')||'<p>등록된 프로필이 없습니다.</p>'}async function act(id,ok){const r=await fetch('/api/admin/profiles/'+id+'/'+(ok?'approve':'reject'),{method:'POST',headers:{'x-admin-key':window.k}});if(r.ok)loadProfiles();else alert('처리에 실패했습니다.');}</script></body></html>
